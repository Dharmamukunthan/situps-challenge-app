name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter 3.19.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Custom Icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Find APK
        run: find . -name "*.apk" -type f
        id: find_apk

      - name: Copy APK to root
        run: |
          mkdir -p ${{ github.workspace }}/apk-output
          find . -name "*.apk" -type f -exec cp {} ${{ github.workspace }}/apk-output/situp-challenge.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: situp-challenge-apk
          path: ${{ github.workspace }}/apk-output/situp-challenge.apk
          if-no-files-found: error
